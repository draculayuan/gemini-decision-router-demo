[project]
name = "gemini-decision-router-demo"
version = "0.1.0"
description = "Dynamic multimodal model routing demo powered by Gemini Decision 1 and Google ADK."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=2.12.0,<3.0.0",
    "google-genai>=2.30.0",
    "google-cloud-secret-manager>=2.21.0",
    "fastapi>=0.115.8,<1.0.0",
    "uvicorn~=0.34.0",
    "httpx[http2]>=0.28.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
